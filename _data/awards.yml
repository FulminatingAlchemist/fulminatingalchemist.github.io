- title: Bristol PLUS Award
  issuer: University of Bristol
  date: Jun 2021
  organisation: University of Bristol
  description: >
    I am among the 5% of Bristol students awarded the Bristol PLUS award. I have achieved it by completing more than 200 hours of extracurricular work as a PASS leader and a Computational Chemistry Intern at the University of Bristol, while pursuing a MSci in Chemistry. Furthermore, in order to accomplish my objective, I have been dedicated to attending meetings and events focusing on employability and completion of the Bristol Futures course “Innovation and Enterprise”. Working towards the award has given me a deeper insight into scientific work at the university, strengthened key skills in group work and allowed me to partake in more innovative thinking and mindset.

